name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tracker
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-not-secret
      DATABASE_URL: postgres://tracker:tracker@localhost:5432/tracker
      SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test
      - run: coverage report --fail-under=70
      - name: check --deploy
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-check-deploy-key-ci-check-deploy-key-ci-check-deploy-key-123' }}
          DEBUG: "False"
          ALLOWED_HOSTS: tracker.example.com
          SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t task-tracker:ci .
