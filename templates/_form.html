{% csrf_token %}
{% if form.non_field_errors %}<div class="alert alert-danger py-2">{{ form.non_field_errors|join:" " }}</div>{% endif %}
{% for field in form %}
  <div class="mb-3">
    {% if field.label %}<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{% endif %}
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
    {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
  </div>
{% endfor %}
