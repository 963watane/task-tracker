{% extends "base.html" %}
{% block title %}{% if object %}Редактирование{% else %}Новая задача{% endif %}{% endblock %}
{% block content %}
<div class="col-md-7">
  <h3>{% if object %}Редактирование задачи{% else %}Новая задача{% endif %}</h3>
  <form method="post" class="card card-body">
    {% include "_form.html" %}
    <div><button class="btn btn-primary">Сохранить</button>
    <a class="btn btn-link" href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'tracker:task_list' %}{% endif %}">Отмена</a></div>
  </form>
</div>
{% endblock %}
